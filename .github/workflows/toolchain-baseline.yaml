name: Minimum Toolchain Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolchain-baseline.yaml'
      - 'scripts/source-*.sh'
      - 'Sources/**/*.swift'
      - 'Package.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '26.0.1'
            runner: macos-15
          - xcode: '26.5'
            runner: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record compiler and SDKs
        run: |
          mkdir -p .build/baseline-evidence
          xcodebuild -version | tee .build/baseline-evidence/xcode.txt
          xcrun swift --version | tee .build/baseline-evidence/swift.txt
          xcodebuild -showsdks > .build/baseline-evidence/sdks.txt
      - name: Initialize platform support
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
      - name: Install removed baseline watchOS platform
        if: matrix.xcode == '26.0.1'
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform watchOS -architectureVariant universal > .build/baseline-evidence/watchos-platform-install.log 2>&1
      - name: Verify source package
        run: swift test --disable-keychain --disable-netrc --filter 'AutoLogRuntimeTests|AutoLogMacroTests' > .build/baseline-evidence/source-tests.log 2>&1
      - name: Verify source runtime consumer
        run: scripts/source-consumer-smoke.sh > .build/baseline-evidence/consumer.log 2>&1
      - name: Verify iOS and watchOS Release links
        run: scripts/source-platform-smoke.sh > .build/baseline-evidence/platforms.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autolog-baseline-xcode-${{ matrix.xcode }}
          path: |
            .build/baseline-evidence
            .build/source-platform-smoke/*.log
          retention-days: 7
