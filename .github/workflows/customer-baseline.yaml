name: Published Customer Baseline

on:
  push:
    branches: [main, codex/swiftui-lifecycle-log-modifiers]
    paths: ['.github/workflows/customer-baseline.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '26.0.1'
            runner: macos-15
          - xcode: '26.5'
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Consume public release without saved credentials
        run: |
          xcodebuild -version
          xcrun swift --version
          scripts/distribution/option-b-distribution-smoke.sh \
            --package-url https://github.com/anciltech/Swift-AutoLog-Distribution.git \
            --version 0.10.3
